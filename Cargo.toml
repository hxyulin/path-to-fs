[package]
name = "path-to-fs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A filesystem that explains placeholder executable paths from tutorials"
license = "CC0-1.0"
repository = "https://github.com/hxyulin/path-to-fs"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3", features = ["termination"] }
fuser = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "path-to-fs"
path = "src/main.rs"

[[bin]]
name = "path-to-fs-helper"
path = "src/bin/path-to-fs-helper.rs"
