name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Check lints
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo +stable test --locked
      - name: Build documentation
        run: cargo +stable doc --locked --no-deps
